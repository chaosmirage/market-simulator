<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Deny-by-default content-security baseline. The static host sets no
      response headers, so the policy ships in-document or never: every
      script, image, font, connection, and worker stays same-origin;
      'wasm-unsafe-eval' scopes WebAssembly compilation (not blanket eval);
      'unsafe-inline' styles admit the framework's runtime style injection.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>market-simulator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
